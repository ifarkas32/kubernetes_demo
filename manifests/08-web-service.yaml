apiVersion: v1 # Core API group
kind: Service # Resource type: stable address for pods
metadata:
  name: web # Service name
  namespace: greeter # Namespace of the Service
spec:
  type: NodePort # Also opens a port on the node (reachable from localhost)
  selector:
    app: web # Send traffic to pods with this label
  ports:
    - port: 80 # Port exposed inside the cluster
      targetPort: 80 # Port on the pod
      nodePort: 30081 # Port on localhost, must be 30000-32767
