apiVersion: v1 # Core API group
kind: Secret # Resource type: stores sensitive values
metadata:
  name: db-credentials # Referenced by the db and api Deployments
  namespace: greeter # Namespace of the Secret
type: Opaque # Generic key/value secret
stringData: # Plain text here, Kubernetes stores it base64-encoded
  POSTGRES_DB: greeter # Database name created on first start
  POSTGRES_USER: greeter # Database user created on first start
  POSTGRES_PASSWORD: greeter-test-password # Test-only password, change for real use
