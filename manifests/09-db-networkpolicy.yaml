apiVersion: networking.k8s.io/v1 # API group for network policies
kind: NetworkPolicy # Resource type: firewall rules between pods
metadata:
  name: db-allow-api-only # Policy name
  namespace: greeter # Namespace of the policy
spec:
  podSelector:
    matchLabels:
      app: db # The policy protects pods with this label
  policyTypes: ["Ingress"] # Restrict incoming traffic only
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api # Only pods with this label may connect
      ports:
        - protocol: TCP # Protocol allowed
          port: 5432 # Only the Postgres port is open
