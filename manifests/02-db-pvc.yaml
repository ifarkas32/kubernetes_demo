apiVersion: v1 # Core API group
kind: PersistentVolumeClaim # Resource type: request for persistent storage
metadata:
  name: db-data # Referenced by the db Deployment volume
  namespace: greeter # Namespace of the claim
spec:
  accessModes: ["ReadWriteOnce"] # Mountable read-write by one node at a time
  resources:
    requests:
      storage: 1Gi # Requested disk size
