apiVersion: v1 # Core API group
kind: Service # Resource type: stable address that load-balances across pods
metadata:
  name: api # DNS name nginx proxies to (http://api:5000)
  namespace: greeter # Namespace of the Service
spec:
  selector:
    app: api # Send traffic to ready pods with this label
  ports:
    - port: 5000 # Port exposed by the Service
      targetPort: 5000 # Port on the pod
